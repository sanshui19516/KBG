<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>为了让我考上高校 · 状态栏</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               【全局重置 · 王春凤专属 · 旧式信笺】
               设计理念：这是一封被打开的信，记录着不该被记录的私密。
               主色：宣纸黄底，暗红印泥，旧金边框，墨黑文字。
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色系：中式复古 */
            --paper: 45, 18%, 88%;
            --paper-dark: 42, 15%, 78%;
            --ink: 0, 0%, 8%;
            --ink-light: 0, 0%, 35%;
            --cinnabar: 350, 55%, 40%;
            --cinnabar-light: 350, 45%, 55%;
            --old-gold: 38, 45%, 50%;
            --old-gold-light: 38, 35%, 65%;
            --bg-dark: 0, 0%, 6%;
            --border-fade: 350, 35%, 25%;

            /* 信笺尺寸参数 */
            --envelope-padding: 24px 22px 18px;
            --card-radius: 4px;
            --border-width: 1.5px;
        }

        /* ===== 信笺容器 ===== */
        .status-wrapper {
            max-width: 620px;
            margin: 1.4rem auto;
            background: hsla(var(--paper), 0.92);
            /* 背景图占位 —— 用户自行替换链接 */
            background-image: url('【此处替换为你的状态栏背景图链接】');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: var(--border-width) solid hsla(var(--cinnabar), 0.25);
            border-radius: var(--card-radius);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px hsla(var(--old-gold), 0.08);
            padding: var(--envelope-padding);
            font-family: 'Noto Serif SC', 'Inter', 'PingFang SC', serif;
            color: hsl(var(--ink));
            position: relative;
            transition: all 0.3s ease;

            /* 信纸纹理（极浅） */
            background-image: url('【此处替换为你的状态栏背景图链接】'), repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.003) 2px,
                    rgba(0, 0, 0, 0.003) 4px);
            background-size: cover, 100% 100%;
            background-blend-mode: overlay, normal;
        }

        /* 信封折痕效果（侧边暗影） */
        .status-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(0, 0, 0, 0.01) 48%,
                    rgba(0, 0, 0, 0.015) 50%,
                    rgba(0, 0, 0, 0.01) 52%,
                    transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .status-wrapper>* {
            position: relative;
            z-index: 1;
        }

        /* ===== 四角回形纹（清晰可见） ===== */
        .corner-border {
            position: absolute;
            width: 22px;
            height: 22px;
            z-index: 2;
            pointer-events: none;
        }
        .corner-border::before,
        .corner-border::after {
            content: '';
            position: absolute;
            background: hsla(var(--cinnabar), 0.12);
            border: 1px solid hsla(var(--cinnabar), 0.08);
        }
        /* 左上 */
        .corner-tl {
            top: 8px;
            left: 8px;
        }
        .corner-tl::before {
            top: 0;
            left: 0;
            width: 10px;
            height: 4px;
            border-bottom: none;
            border-right: none;
        }
        .corner-tl::after {
            bottom: 0;
            right: 0;
            width: 4px;
            height: 10px;
            border-top: none;
            border-left: none;
        }
        /* 右上 */
        .corner-tr {
            top: 8px;
            right: 8px;
        }
        .corner-tr::before {
            top: 0;
            right: 0;
            width: 10px;
            height: 4px;
            border-bottom: none;
            border-left: none;
        }
        .corner-tr::after {
            bottom: 0;
            left: 0;
            width: 4px;
            height: 10px;
            border-top: none;
            border-right: none;
        }
        /* 左下 */
        .corner-bl {
            bottom: 8px;
            left: 8px;
        }
        .corner-bl::before {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 4px;
            border-top: none;
            border-right: none;
        }
        .corner-bl::after {
            top: 0;
            right: 0;
            width: 4px;
            height: 10px;
            border-bottom: none;
            border-left: none;
        }
        /* 右下 */
        .corner-br {
            bottom: 8px;
            right: 8px;
        }
        .corner-br::before {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 4px;
            border-top: none;
            border-left: none;
        }
        .corner-br::after {
            top: 0;
            left: 0;
            width: 4px;
            height: 10px;
            border-bottom: none;
            border-right: none;
        }

        /* ===== 顶部装饰线（信笺头） ===== */
        .header-deco {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.08);
            position: relative;
        }
        .header-deco .line-left,
        .header-deco .line-right {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, hsla(var(--cinnabar), 0.12) 30%, hsla(var(--cinnabar), 0.12) 70%, transparent);
        }
        .header-deco .diamond {
            width: 6px;
            height: 6px;
            background: hsla(var(--cinnabar), 0.10);
            transform: rotate(45deg);
            flex-shrink: 0;
            border: 1px solid hsla(var(--cinnabar), 0.04);
        }
        .header-deco .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.06);
            flex-shrink: 0;
        }

        /* ===== 主标题栏 ===== */
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.04);
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header-main .title {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            color: hsl(var(--cinnabar));
            text-shadow: 0 0 30px hsla(var(--cinnabar), 0.02);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-main .title .seal {
            display: inline-block;
            font-size: 9px;
            background: hsla(var(--cinnabar), 0.04);
            border: 1px solid hsla(var(--cinnabar), 0.06);
            padding: 1px 10px;
            border-radius: 2px;
            letter-spacing: 2px;
            color: hsla(var(--cinnabar), 0.4);
        }
        .header-main .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            color: hsl(var(--ink-light), 0.5);
            letter-spacing: 0.5px;
        }
        .header-main .meta .loc {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-main .meta .loc svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.2);
            stroke-width: 1.5;
        }
        .header-main .meta .time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-main .meta .time svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.2);
            stroke-width: 1.5;
        }
        .header-main .meta .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.15);
            display: inline-block;
        }
        .fold-btn {
            background: none;
            border: none;
            color: hsl(var(--ink-light), 0.2);
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
            font-size: 12px;
        }
        .fold-btn:hover {
            color: hsl(var(--ink-light), 0.4);
        }
        .fold-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .status-wrapper.collapsed .fold-btn svg {
            transform: rotate(-90deg);
        }
        .status-wrapper.collapsed .body-content {
            display: none;
        }
        .status-wrapper.collapsed .header-main {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .status-wrapper.collapsed .header-deco {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        /* ===== 主体内容（折叠控制） ===== */
        .body-content {
            display: block;
        }

        /* ===== 双栏网格（人物并排） ===== */
        .person-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        /* ===== 人物卡片 ===== */
        .person-card {
            background: hsla(var(--paper-dark), 0.15);
            border: 1px solid hsla(var(--cinnabar), 0.04);
            border-radius: var(--card-radius);
            padding: 14px 14px 10px;
            transition: all 0.3s ease;
            position: relative;
        }
        .person-card:hover {
            border-color: hsla(var(--cinnabar), 0.08);
            background: hsla(var(--paper-dark), 0.20);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .person-card .card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.02);
        }

        /* 头像：王春凤（竖版） */
        .person-card .avatar {
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid hsla(var(--cinnabar), 0.06);
            background: hsla(var(--paper), 0.3);
            transition: all 0.3s ease;
            cursor: default;
            width: 48px;
            height: 64px;
            border-radius: 2px;
        }
        .person-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .person-card .avatar .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            font-weight: 700;
            color: hsla(var(--cinnabar), 0.15);
        }

        /* 玩家头像（圆形） */
        #userCard .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: hsla(var(--paper), 0.2);
        }
        #userCard .avatar .placeholder {
            font-size: 16px;
            color: hsla(var(--ink-light), 0.15);
        }

        .person-card .info {
            flex: 1;
            min-width: 0;
        }
        .person-card .info .name {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            font-weight: 700;
            color: hsl(var(--ink));
            letter-spacing: 2px;
        }
        .person-card .info .name .sub {
            font-size: 9px;
            font-weight: 400;
            color: hsl(var(--ink-light), 0.3);
            letter-spacing: 1px;
            margin-left: 4px;
        }
        .person-card .info .action-line {
            font-size: 10px;
            color: hsl(var(--ink-light), 0.4);
            letter-spacing: 0.3px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 1px;
        }
        .person-card .info .action-line svg {
            width: 10px;
            height: 10px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.12);
            stroke-width: 1.5;
            flex-shrink: 0;
        }
        .person-card .info .emotion-tag {
            display: inline-block;
            font-size: 9px;
            color: hsla(var(--cinnabar), 0.5);
            background: hsla(var(--cinnabar), 0.02);
            border: 1px solid hsla(var(--cinnabar), 0.02);
            padding: 0 8px;
            border-radius: 2px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ===== 内心话区域（独立通栏） ===== */
        .inner-section {
            background: hsla(var(--paper-dark), 0.10);
            border-left: 2px solid hsla(var(--cinnabar), 0.08);
            border-right: 2px solid hsla(var(--cinnabar), 0.04);
            padding: 10px 16px;
            margin-bottom: 14px;
            border-radius: var(--card-radius);
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .inner-section .inner-mark {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            color: hsla(var(--cinnabar), 0.06);
            line-height: 1;
            flex-shrink: 0;
        }
        .inner-section .inner-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            color: hsl(var(--ink-light), 0.65);
            line-height: 1.7;
            letter-spacing: 0.5px;
            font-style: italic;
            flex: 1;
            min-height: 22px;
        }
        .inner-section .inner-label {
            font-size: 8px;
            color: hsla(var(--cinnabar), 0.12);
            letter-spacing: 3px;
            writing-mode: vertical-rl;
            flex-shrink: 0;
            padding: 2px 0;
        }
        /* 内心话装饰——两侧小点 */
        .inner-section::before,
        .inner-section::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.02);
        }
        .inner-section::before {
            top: 4px;
            left: 6px;
        }
        .inner-section::after {
            bottom: 4px;
            right: 6px;
        }

        /* ===== 数值与身体描述区域（左右并排） ===== */
        .stats-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        /* ===== 数值区：竖排印章样式 ===== */
        .stats-section {
            background: hsla(var(--paper-dark), 0.08);
            border: 1px solid hsla(var(--cinnabar), 0.02);
            border-radius: var(--card-radius);
            padding: 10px 12px 8px;
        }
        .stats-section .stats-title {
            font-size: 8px;
            letter-spacing: 4px;
            color: hsla(var(--cinnabar), 0.12);
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.02);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-section .stats-title .seal-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.04);
        }

        .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.01);
            font-size: 10.5px;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-item .stat-label {
            font-family: 'Noto Serif SC', serif;
            color: hsl(var(--ink-light), 0.3);
            letter-spacing: 1px;
            font-weight: 400;
        }
        .stat-item .stat-value {
            font-weight: 700;
            font-size: 12px;
            color: hsl(var(--cinnabar));
            font-variant-numeric: tabular-nums;
        }
        .stat-item .stat-value.mask {
            color: hsl(var(--ink-light), 0.6);
        }
        .stat-item .stat-value.dark {
            color: hsl(var(--cinnabar-light));
        }

        /* ===== 身体描述区 ===== */
        .body-section {
            background: hsla(var(--paper-dark), 0.08);
            border: 1px solid hsla(var(--cinnabar), 0.02);
            border-radius: var(--card-radius);
            padding: 10px 12px 8px;
        }
        .body-section .body-title {
            font-size: 8px;
            letter-spacing: 4px;
            color: hsla(var(--cinnabar), 0.12);
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.02);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .body-section .body-title .seal-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.04);
        }

        .body-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 2px 0;
            font-size: 9.5px;
            color: hsl(var(--ink-light), 0.5);
            line-height: 1.6;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.005);
        }
        .body-item:last-child {
            border-bottom: none;
        }
        .body-item .body-tag {
            font-family: 'Noto Serif SC', serif;
            font-size: 8px;
            color: hsla(var(--cinnabar), 0.15);
            letter-spacing: 1px;
            flex-shrink: 0;
            width: 28px;
        }
        .body-item .body-desc {
            font-size: 9.5px;
            color: hsl(var(--ink-light), 0.45);
            line-height: 1.5;
            flex: 1;
        }

        /* ===== 底部亲密行为（通栏） ===== */
        .intimacy-section {
            background: hsla(var(--paper-dark), 0.05);
            border-top: 1px solid hsla(var(--cinnabar), 0.02);
            padding-top: 10px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .intimacy-section .intimacy-label {
            font-size: 8px;
            letter-spacing: 4px;
            color: hsla(var(--cinnabar), 0.10);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .intimacy-section .intimacy-label svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.06);
            stroke-width: 1.5;
        }
        .intimacy-section .intimacy-items {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .intimacy-section .intimacy-item {
            font-size: 9px;
            color: hsl(var(--ink-light), 0.25);
            letter-spacing: 0.5px;
            background: hsla(var(--paper), 0.2);
            border: 1px solid hsla(var(--cinnabar), 0.02);
            padding: 1px 12px;
            border-radius: 20px;
            line-height: 1.8;
        }

        /* ===== 折叠时隐藏 ===== */
        .status-wrapper.collapsed .body-content {
            display: none;
        }

        /* ===== 图片放大遮罩 ===== */
        .img-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .img-overlay.open {
            display: flex;
            opacity: 1;
        }
        .img-overlay img {
            max-width: 85vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            cursor: default;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .img-overlay.open img {
            transform: scale(1);
        }
        .img-overlay .close-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .status-wrapper {
                padding: 14px 12px 12px;
                border-radius: 2px;
                margin: 0.6rem auto;
            }
            .person-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .stats-body-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .header-main .title {
                font-size: 11px;
                letter-spacing: 2px;
                gap: 6px;
            }
            .header-main .title .seal {
                font-size: 7px;
                padding: 0 6px;
            }
            .header-main .meta {
                font-size: 8px;
                gap: 6px;
                flex-wrap: wrap;
            }
            .inner-section {
                padding: 6px 10px;
            }
            .inner-section .inner-text {
                font-size: 10px;
            }
            .inner-section .inner-mark {
                font-size: 14px;
            }
