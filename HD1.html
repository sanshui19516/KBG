<script type="module">
    /* 严格遵循 MVU-5 规范：使用 jQuery、errorCatched、等待 Mvu 初始化 */
    $(function() {
        /* 发送消息函数：先填入文本，再触发发送按钮 */
        function sendMessage(text) {
            try {
                /* 1. 获取输入框并填入文本 */
                const textarea = document.querySelector('#send_textarea') ||
                                 (window.parent && window.parent.document.querySelector('#send_textarea'));
                if (!textarea) return;
                textarea.value = text;
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
                textarea.focus();

                /* 2. 查找发送按钮并模拟点击 */
                const sendBtn = document.querySelector('#send_button') ||
                                document.querySelector('#send_btn') ||
                                document.querySelector('button[type="submit"]') ||
                                (window.parent && window.parent.document.querySelector('#send_button'));
                if (sendBtn) {
                    sendBtn.click();
                } else {
                    /* 备选：尝试触发回车键 */
                    const enterEvent = new KeyboardEvent('keydown', {
                        key: 'Enter',
                        code: 'Enter',
                        keyCode: 13,
                        which: 13,
                        bubbles: true
                    });
                    textarea.dispatchEvent(enterEvent);
                }
            } catch (e) { console.error('发送失败:', e); }
        }

        /* 从隐藏 holder 中读取选项并渲染按钮 */
        function renderOptions() {
            const $holder = $('#options-data-holder');
            if (!$holder.length) return;
            let optionsStr = $holder.text();
            if (!optionsStr || optionsStr.trim() === '') {
                $('.options-buttons').html('<div style="text-align:center; color:#aaa;">暂无可选行动</div>');
                return;
            }
            const items = optionsStr.split('|').map(s => s.trim()).filter(s => s !== '');
            if (items.length === 0) {
                $('.options-buttons').html('<div style="text-align:center; color:#aaa;">暂无可选行动</div>');
                return;
            }
            let html = '';
            for (let item of items) {
                /* 转义 HTML 实体和引号 */
                const escaped = item.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                }).replace(/"/g, '&quot;');
                const safeText = escaped.replace(/'/g, "\\'");
                html += `<div class="option-btn" data-opt="${safeText}">${escaped}</div>`;
            }
            $('.options-buttons').html(html);
        }

        /* 折叠功能 */
        function initCollapse() {
            const $panel = $('.mvu-options-panel');
            const $header = $('.options-header');
            $header.off('click').on('click', function() {
                $panel.toggleClass('collapsed');
            });
        }

        /* 绑定按钮点击事件：直接发送 */
        function bindOptionSend() {
            $(document).off('click', '.option-btn').on('click', '.option-btn', function() {
                const opt = $(this).attr('data-opt') || $(this).text();
                if (opt) sendMessage(opt);
            });
        }

        /* 主初始化 */
        async function init() {
            if (typeof waitGlobalInitialized === 'function') {
                await waitGlobalInitialized('Mvu');
            }
            renderOptions();
            initCollapse();
            bindOptionSend();
        }

        if (typeof errorCatched === 'function') {
            $(errorCatched(init));
        } else {
            $(init);
        }
    });
</script>
