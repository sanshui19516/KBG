    <script type="module">
        /* ---------- 辅助函数 ---------- */
        function fillInput(text) {
            try {
                const textarea = document.querySelector('#send_textarea') || 
                                 (window.parent && window.parent.document.querySelector('#send_textarea'));
                if (textarea) {
                    textarea.value = text;
                    textarea.dispatchEvent(new Event('input', { bubbles: true }));
                    textarea.focus();
                }
            } catch (e) { console.error(e); }
        }

        /* 安全获取变量值 */
        function safeValue(obj, path, def = 0) {
            const val = _.get(obj, path, def);
            return val !== undefined && val !== null ? val : def;
        }

        /* 更新所有UI */
        function updateDashboard() {
            try {
                const allVars = typeof getAllVariables === 'function' ? getAllVariables() : {};
                const statData = _.get(allVars, 'stat_data', {});
                
                // 世界环境
                const world = _.get(statData, '世界', {});
                $('#mvu-world-date').text(safeValue(world, '当前日期', '第1天'));
                $('#mvu-world-time').text(safeValue(world, '时间', '正午'));
                $('#mvu-world-weather').text(safeValue(world, '天气', '晴朗烈日'));
                $('#mvu-world-location').text(safeValue(world, '地点', '沙滩'));
                
                // 获取用户名：优先从变量池 user.姓名 读取，若为空则使用酒馆内置名称
                let userName = _.get(statData, 'user.姓名', '');
                if (!userName || userName === '') {
                    userName = window.SillyTavern?.context?.user_name || window.user_name || '{{user}}';
                }
                if (userName && $('#user-name').text() !== userName) {
                    $('#user-name').text(userName);
                }
                
                // 定义角色组（主角键名为 'user'，与 Schema 一致）
                const roles = [
                    { key: 'user', nameKey: 'user', nameFallback: '{{user}}', avatarId: 'avatar-user', nameId: 'user-name', emotionId: 'user-emotion' },
                    { key: '苏澜', nameKey: '苏澜', nameFallback: '苏澜', avatarId: 'avatar-sulan', nameId: 'sulan-name', emotionId: 'sulan-emotion' },
                    { key: '周宁', nameKey: '周宁', nameFallback: '周宁', avatarId: 'avatar-zhouning', nameId: 'zhouning-name', emotionId: 'zhouning-emotion' }
                ];
                
                const fields = ['体能', '饱食度', '水分', '健康', '内心紧绷度', '衣物破损度', '晒伤程度'];
                
                // 正向属性（数值越高越好，危险阈值 ≤10）
                const positiveFields = ['体能', '饱食度', '水分', '健康'];
                // 反向属性（数值越低越好，危险阈值 ≥90）
                const negativeFields = ['内心紧绷度', '晒伤程度'];
                
                roles.forEach(role => {
                    const roleData = _.get(statData, role.key, {});
                    // 更新情绪
                    const emotion = safeValue(roleData, '情绪状态', '');
                    if (emotion) $(`#${role.emotionId}`).text(emotion);
                    
                    // 更新各项数值和进度条
                    fields.forEach(field => {
                        let val = safeValue(roleData, field, null);
                        if (val !== null && val !== undefined && val !== '') {
                            const num = Number(val);
                            if (!isNaN(num)) {
                                const percent = Math.min(100, Math.max(0, num));
                                let barId, valId;
                                if (role.key === 'user') {
                                    barId = `#bar-user-${field}`;
                                    valId = `#val-user-${field}`;
                                } else {
                                    barId = `#bar-${role.key}-${field}`;
                                    valId = `#val-${role.key}-${field}`;
                                }
                                $(barId).css('width', `${percent}%`);
                                $(valId).text(Math.floor(num));
                                
                                // 获取该属性的 stat-row 容器
                                const $row = $(barId).closest('.stat-row');
                                let isAlert = false;
                                if (positiveFields.includes(field)) {
                                    isAlert = num <= 10;
                                } else if (negativeFields.includes(field)) {
                                    isAlert = num >= 90;
                                }
                                if (field !== '衣物破损度') {
                                    $row.toggleClass('alert', isAlert);
                                } else {
                                    $row.removeClass('alert');
                                }
                            }
                        }
                    });
                });
                
            } catch (e) {
                console.error('状态栏更新出错:', e);
            }
        }

        /* 初始化折叠交互 */
        function initCollapse() {
            const $header = $('#dashboard-header');
            const $content = $('#dashboard-content');
            $header.off('click').on('click', function() {
                $header.toggleClass('collapsed');
                $content.toggleClass('collapsed');
            });
        }

        /* 入口 */
        async function init() {
            if (typeof waitGlobalInitialized === 'function') {
                await waitGlobalInitialized('Mvu');
            }
            updateDashboard();
            initCollapse();
            setInterval(updateDashboard, 1500);
            if (typeof document !== 'undefined') {
                $(document).off('VARIABLE_UPDATE_ENDED', updateDashboard);
                $(document).on('VARIABLE_UPDATE_ENDED', updateDashboard);
            }
        }

        $(typeof errorCatched === 'function' ? errorCatched(init) : init);
    </script>
