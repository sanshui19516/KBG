<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>为了让我考上高校 · 状态栏</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* 中式复古配色 */
            --paper: 45, 18%, 88%;
            --paper-dark: 42, 15%, 78%;
            --ink: 0, 0%, 8%;
            --ink-mid: 0, 0%, 22%;
            --ink-light: 0, 0%, 38%;
            --cinnabar: 350, 55%, 40%;
            --cinnabar-light: 350, 45%, 52%;
            --old-gold: 38, 45%, 50%;
            --old-gold-light: 38, 35%, 65%;

            --card-radius: 4px;
        }

        /* ============ 信笺容器 ============ */
        .status-wrapper {
            max-width: 680px;
            margin: 1.6rem auto;
            background: hsla(var(--paper), 0.94);
            background-image: url('【此处替换为你的状态栏背景图链接】');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid hsla(var(--cinnabar), 0.30);
            border-radius: var(--card-radius);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px hsla(var(--old-gold), 0.12);
            padding: 32px 30px 24px;
            font-family: 'Noto Serif SC', 'Inter', 'PingFang SC', serif;
            color: hsl(var(--ink));
            position: relative;
            transition: all 0.3s ease;
        }

        .status-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 10%;
            width: 80%; height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0,0,0,0.012) 48%,
                rgba(0,0,0,0.018) 50%,
                rgba(0,0,0,0.012) 52%,
                transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .status-wrapper > * { position: relative; z-index: 1; }

        /* ============ 四角回形纹 ============ */
        .corner-border {
            position: absolute;
            width: 26px; height: 26px;
            z-index: 2;
            pointer-events: none;
        }
        .corner-border::before,
        .corner-border::after {
            content: '';
            position: absolute;
            background: hsla(var(--cinnabar), 0.18);
            border: 1px solid hsla(var(--cinnabar), 0.12);
        }
        .corner-tl { top: 10px; left: 10px; }
        .corner-tl::before { top: 0; left: 0; width: 12px; height: 4px; border-bottom: none; border-right: none; }
        .corner-tl::after { bottom: 0; right: 0; width: 4px; height: 12px; border-top: none; border-left: none; }
        .corner-tr { top: 10px; right: 10px; }
        .corner-tr::before { top: 0; right: 0; width: 12px; height: 4px; border-bottom: none; border-left: none; }
        .corner-tr::after { bottom: 0; left: 0; width: 4px; height: 12px; border-top: none; border-right: none; }
        .corner-bl { bottom: 10px; left: 10px; }
        .corner-bl::before { bottom: 0; left: 0; width: 12px; height: 4px; border-top: none; border-right: none; }
        .corner-bl::after { top: 0; right: 0; width: 4px; height: 12px; border-bottom: none; border-left: none; }
        .corner-br { bottom: 10px; right: 10px; }
        .corner-br::before { bottom: 0; right: 0; width: 12px; height: 4px; border-top: none; border-left: none; }
        .corner-br::after { top: 0; left: 0; width: 4px; height: 12px; border-bottom: none; border-right: none; }

        /* ============ 顶部装饰线 ============ */
        .header-deco {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.15);
        }
        .header-deco .line-left,
        .header-deco .line-right {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                hsla(var(--cinnabar), 0.25) 30%,
                hsla(var(--cinnabar), 0.25) 70%,
                transparent);
        }
        .header-deco .diamond {
            width: 7px; height: 7px;
            background: hsla(var(--cinnabar), 0.25);
            transform: rotate(45deg);
            flex-shrink: 0;
            border: 1px solid hsla(var(--cinnabar), 0.12);
        }
        .header-deco .dot {
            width: 3px; height: 3px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.15);
            flex-shrink: 0;
        }

        /* ============ 主标题栏 ============ */
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.10);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-main .title {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 6px;
            color: hsl(var(--cinnabar));
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-main .title .seal {
            display: inline-block;
            font-size: 11px;
            background: hsla(var(--cinnabar), 0.10);
            border: 1px solid hsla(var(--cinnabar), 0.25);
            padding: 3px 12px;
            border-radius: 2px;
            letter-spacing: 3px;
            color: hsl(var(--cinnabar));
            font-weight: 700;
        }
        .header-main .meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: hsl(var(--ink-light));
            letter-spacing: 0.5px;
        }
        .header-main .meta .loc,
        .header-main .meta .time {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .header-main .meta svg {
            width: 14px; height: 14px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.5);
            stroke-width: 1.6;
        }
        .header-main .meta .dot {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.4);
            display: inline-block;
        }
        .fold-btn {
            background: none;
            border: none;
            color: hsl(var(--ink-light));
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
        }
        .fold-btn:hover { color: hsl(var(--cinnabar)); }
        .fold-btn svg {
            width: 18px; height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .status-wrapper.collapsed .fold-btn svg { transform: rotate(-90deg); }
        .status-wrapper.collapsed .body-content { display: none; }
        .status-wrapper.collapsed .header-main {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .status-wrapper.collapsed .header-deco {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .body-content { display: block; }

        /* ============ 人物网格 ============ */
        .person-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .person-card {
            background: hsla(var(--paper-dark), 0.25);
            border: 1px solid hsla(var(--cinnabar), 0.10);
            border-radius: var(--card-radius);
            padding: 18px 18px 14px;
            transition: all 0.3s ease;
            position: relative;
        }
        .person-card:hover {
            border-color: hsla(var(--cinnabar), 0.22);
            background: hsla(var(--paper-dark), 0.32);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .person-card .card-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.06);
        }

        .person-card .avatar {
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid hsla(var(--cinnabar), 0.20);
            background: hsla(var(--paper), 0.4);
            transition: all 0.3s ease;
            width: 56px;
            height: 76px;
            border-radius: 3px;
        }
        .person-card .avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .person-card .avatar .placeholder {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Serif SC', serif;
            font-size: 26px;
            font-weight: 700;
            color: hsla(var(--cinnabar), 0.4);
        }

        #userCard .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
        }
        #userCard .avatar .placeholder {
            font-size: 20px;
            color: hsla(var(--ink-light), 0.5);
        }

        .person-card .info {
            flex: 1;
            min-width: 0;
        }
        .person-card .info .name {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            font-weight: 700;
            color: hsl(var(--ink));
            letter-spacing: 2px;
        }
        .person-card .info .name .sub {
            font-size: 11px;
            font-weight: 400;
            color: hsl(var(--ink-light));
            letter-spacing: 1px;
            margin-left: 6px;
        }
        .person-card .info .action-line {
            font-size: 13px;
            color: hsl(var(--ink-mid));
            letter-spacing: 0.3px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .person-card .info .action-line svg {
            width: 12px; height: 12px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.5);
            stroke-width: 1.6;
            flex-shrink: 0;
        }
        .person-card .info .emotion-tag {
            display: inline-block;
            font-size: 11px;
            color: hsl(var(--cinnabar));
            background: hsla(var(--cinnabar), 0.08);
            border: 1px solid hsla(var(--cinnabar), 0.15);
            padding: 2px 10px;
            border-radius: 2px;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* ============ 内心话 ============ */
        .inner-section {
            background: hsla(var(--paper-dark), 0.20);
            border-left: 3px solid hsla(var(--cinnabar), 0.35);
            border-right: 1px solid hsla(var(--cinnabar), 0.10);
            border-top: 1px solid hsla(var(--cinnabar), 0.10);
            border-bottom: 1px solid hsla(var(--cinnabar), 0.10);
            padding: 16px 20px;
            margin-bottom: 20px;
            border-radius: var(--card-radius);
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .inner-section .inner-mark {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            color: hsla(var(--cinnabar), 0.3);
            line-height: 1;
            flex-shrink: 0;
            font-weight: 700;
        }
        .inner-section .inner-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            color: hsl(var(--ink-mid));
            line-height: 1.85;
            letter-spacing: 0.6px;
            font-style: italic;
            flex: 1;
            min-height: 26px;
            font-weight: 500;
        }
        .inner-section .inner-label {
            font-size: 10px;
            color: hsl(var(--cinnabar));
            letter-spacing: 4px;
            writing-mode: vertical-rl;
            flex-shrink: 0;
            padding: 2px 0;
            opacity: 0.65;
            font-weight: 600;
        }

        /* ============ 数值 + 身体 ============ */
        .stats-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .stats-section,
        .body-section {
            background: hsla(var(--paper-dark), 0.18);
            border: 1px solid hsla(var(--cinnabar), 0.10);
            border-radius: var(--card-radius);
            padding: 16px 18px 12px;
        }
        .stats-section .stats-title,
        .body-section .body-title {
            font-size: 10px;
            letter-spacing: 5px;
            color: hsl(var(--cinnabar));
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 1px solid hsla(var(--cinnabar), 0.10);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            opacity: 0.85;
        }
        .stats-section .stats-title .seal-dot,
        .body-section .body-title .seal-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: hsla(var(--cinnabar), 0.4);
        }

        .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px dashed hsla(var(--cinnabar), 0.08);
            font-size: 13.5px;
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-item .stat-label {
            font-family: 'Noto Serif SC', serif;
            color: hsl(var(--ink-mid));
            letter-spacing: 1.5px;
            font-weight: 500;
        }
        .stat-item .stat-value {
            font-weight: 900;
            font-size: 20px;
            color: hsl(var(--cinnabar));
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', 'Noto Serif SC', serif;
            letter-spacing: 0.5px;
        }
        .stat-item .stat-value.mask { color: hsl(var(--ink-mid)); }
        .stat-item .stat-value.dark { color: hsl(var(--cinnabar-light)); }

        .body-item {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 6px 0;
            font-size: 12.5px;
            color: hsl(var(--ink-mid));
            line-height: 1.65;
            border-bottom: 1px dashed hsla(var(--cinnabar), 0.06);
        }
        .body-item:last-child { border-bottom: none; }
        .body-item .body-tag {
            font-family: 'Noto Serif SC', serif;
            font-size: 11px;
            color: hsl(var(--cinnabar));
            letter-spacing: 2px;
            flex-shrink: 0;
            width: 30px;
            font-weight: 700;
            opacity: 0.8;
        }
        .body-item .body-desc {
            font-size: 12.5px;
            color: hsl(var(--ink-mid));
            line-height: 1.65;
            flex: 1;
            font-weight: 400;
        }

        /* ============ 底部亲密行为 ============ */
        .intimacy-section {
            background: hsla(var(--paper-dark), 0.14);
            border: 1px solid hsla(var(--cinnabar), 0.10);
            border-radius: var(--card-radius);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .intimacy-section .intimacy-label {
            font-size: 10px;
            letter-spacing: 5px;
            color: hsl(var(--cinnabar));
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-weight: 700;
            opacity: 0.85;
        }
        .intimacy-section .intimacy-label svg {
            width: 14px; height: 14px;
            fill: none;
            stroke: hsla(var(--cinnabar), 0.5);
            stroke-width: 1.8;
        }
        .intimacy-section .intimacy-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }
        .intimacy-section .intimacy-item {
            font-size: 12px;
            color: hsl(var(--ink-mid));
            letter-spacing: 0.5px;
            background: hsla(var(--paper), 0.5);
            border: 1px solid hsla(var(--cinnabar), 0.15);
            padding: 4px 16px;
            border-radius: 20px;
            line-height: 1.6;
            font-weight: 500;
        }

        /* ============ 图片放大遮罩 ============ */
        .img-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .img-overlay.open { display: flex; opacity: 1; }
        .img-overlay img {
            max-width: 85vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            cursor: default;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .img-overlay.open img { transform: scale(1); }
        .img-overlay .close-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 520px) {
            .status-wrapper {
                padding: 20px 16px 16px;
                border-radius: 3px;
                margin: 0.8rem auto;
            }
            .person-grid,
            .stats-body-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .header-main .title {
                font-size: 16px;
                letter-spacing: 3px;
                gap: 8px;
            }
            .header-main .title .seal {
                font-size: 9px;
                padding: 2px 8px;
            }
            .header-main .meta {
                font-size: 11px;
                gap: 10px;
            }
            .inner-section { padding: 12px 14px; }
            .inner-section .inner-text { font-size: 13px; }
            .inner-section .inner-mark { font-size: 22px; }
            .person-card { padding: 14px 14px 10px; }
            .person-card .avatar { width: 48px; height: 64px; }
            #userCard .avatar { width: 44px; height: 44px; }
            .person-card .info .name { font-size: 14px; }
            .stat-item .stat-value { font-size: 17px; }
            .body-item .body-desc { font-size: 12px; }
            .intimacy-section { padding: 12px 14px; gap: 12px; }
        }

        @media (max-width: 380px) {
            .status-wrapper { padding: 16px 12px 12px; }
            .header-main .title { font-size: 14px; letter-spacing: 2px; }
            .stat-item { font-size: 12px; }
            .stat-item .stat-value { font-size: 16px; }
        }

        @media (min-width: 600px) {
            .status-wrapper { padding: 36px 34px 28px; }
            .person-card .avatar { width: 64px; height: 84px; }
            #userCard .avatar { width: 58px; height: 58px; }
            .inner-section .inner-text { font-size: 15px; }
            .stat-item { font-size: 14px; }
            .stat-item .stat-value { font-size: 22px; }
            .body-item .body-desc { font-size: 13.5px; }
        }
    </style>
</head>
<body>
    <div class="status-wrapper" id="statusApp">
        <div id="status-data" style="display: none;">$1</div>

        <div class="corner-border corner-tl"></div>
        <div class="corner-border corner-tr"></div>
        <div class="corner-border corner-bl"></div>
        <div class="corner-border corner-br"></div>

        <div class="header-deco">
            <span class="line-left"></span>
            <span class="diamond"></span>
            <span class="dot"></span>
            <span class="diamond"></span>
            <span class="dot"></span>
            <span class="diamond"></span>
            <span class="line-right"></span>
        </div>

        <div class="header-main">
            <div class="title">
                为了让我考上高校
                <span class="seal">王春凤</span>
            </div>
            <div class="meta">
                <span class="loc">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span id="display-loc">公寓客厅</span>
                </span>
                <span class="dot"></span>
                <span class="time">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="display-time">下午</span>
                </span>
                <button class="fold-btn" id="toggleFold" aria-label="折叠状态栏">
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
            </div>
        </div>

        <div class="body-content">

            <div class="person-grid">
                <div class="person-card" id="linCard">
                    <div class="card-header">
                        <div class="avatar" id="linAvatar"><span class="placeholder">凤</span></div>
                        <div class="info">
                            <div class="name">
                                王春凤
                                <span class="sub">母亲</span>
                            </div>
                            <div class="action-line">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                                <span id="linAction">正在...</span>
                            </div>
                            <div class="emotion-tag" id="linEmotion">端庄严肃</div>
                        </div>
                    </div>
                </div>

                <div class="person-card" id="userCard">
                    <div class="card-header">
                        <div class="avatar" id="userAvatar"><span class="placeholder">子</span></div>
                        <div class="info">
                            <div class="name">
                                {{user}}
                                <span class="sub">儿子</span>
                            </div>
                            <div class="action-line">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
