<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>合住之后 · 状态栏</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <style>
        /* ==========================================
           全局重置
           ========================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: transparent;
            padding: 0;
            margin: 0;
            display: block;
        }

        .status-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: hsla(0, 0%, 100%, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            border: 1px solid hsla(0, 0%, 100%, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 16px 16px 14px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .status-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, hsla(35, 60%, 55%, 0.05), transparent 60%);
            animation: shimmer 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes shimmer {
            0% {
                transform: translate(-5%, -5%) scale(1);
                opacity: 0.4;
            }
            100% {
                transform: translate(5%, 5%) scale(1.1);
                opacity: 0.8;
            }
        }

        .status-container>* {
            position: relative;
            z-index: 1;
        }

        /* ===== 顶部栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid hsla(0, 0%, 100%, 0.04);
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: hsl(35, 60%, 65%);
            text-transform: uppercase;
        }

        .header-title svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: hsl(35, 60%, 55%);
            stroke-width: 2;
            vertical-align: middle;
            margin-right: 4px;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: hsla(0, 0%, 100%, 0.4);
        }

        .header-info .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: hsl(35, 60%, 55%);
            display: inline-block;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .header-info .scene {
            color: hsla(0, 0%, 100%, 0.65);
        }
        .header-info .time {
            color: hsla(0, 0%, 100%, 0.35);
        }
        /* ===== 新增：天数显示样式 ===== */
        .header-info .day {
            color: hsla(35, 60%, 55%, 0.5);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .fold-btn {
            background: none;
            border: none;
            color: hsla(0, 0%, 100%, 0.25);
            cursor: pointer;
            padding: 4px;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 0;
        }

        .fold-btn:hover {
            color: hsla(0, 0%, 100%, 0.5);
        }

        .fold-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .status-container.collapsed .fold-btn svg {
            transform: rotate(-90deg);
        }

        .status-container.collapsed .inner-voice,
        .status-container.collapsed .tabs,
        .status-container.collapsed .tab-content {
            display: none;
        }

        .status-container.collapsed .header {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* ===== 内心话 ===== */
        .inner-voice {
            background: linear-gradient(135deg, hsla(35, 50%, 20%, 0.2), hsla(270, 20%, 20%, 0.1));
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-left: 2px solid hsla(35, 60%, 55%, 0.25);
            position: relative;
            min-height: 48px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .inner-voice .icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            margin-top: 2px;
            color: hsla(35, 60%, 55%, 0.4);
        }

        .inner-voice .icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .inner-voice .text {
            font-size: 13px;
            line-height: 1.6;
            color: hsla(0, 0%, 100%, 0.85);
            font-weight: 400;
            flex: 1;
            min-height: 1.6em;
        }

        .inner-voice .text .name-tag {
            font-size: 10px;
            color: hsla(35, 60%, 55%, 0.4);
            font-weight: 500;
            letter-spacing: 0.5px;
            display: block;
            margin-top: 2px;
        }

        .inner-voice .quote-mark {
            position: absolute;
            font-size: 24px;
            color: hsla(35, 60%, 55%, 0.06);
            font-family: Georgia, serif;
            line-height: 1;
            pointer-events: none;
        }
        .inner-voice .quote-mark.left {
            top: 4px;
            left: 10px;
        }
        .inner-voice .quote-mark.right {
            bottom: 0px;
            right: 10px;
            transform: rotate(180deg);
        }

        /* ===== 页签栏 ===== */
        .tabs {
            display: flex;
            gap: 2px;
            background: hsla(0, 0%, 0%, 0.2);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 0;
            border: none;
            background: transparent;
            color: hsla(0, 0%, 100%, 0.3);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-btn svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tab-btn:hover {
            color: hsla(0, 0%, 100%, 0.55);
        }

        .tab-btn.active {
            background: hsla(35, 50%, 40%, 0.15);
            color: hsl(35, 60%, 65%);
            box-shadow: 0 0 20px hsla(35, 60%, 55%, 0.04);
        }

        /* ===== 页签内容 ===== */
        .tab-content {
            position: relative;
            min-height: 160px;
        }

        .tab-pane {
            display: none;
            animation: paneIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes paneIn {
            0% {
                opacity: 0;
                transform: translateY(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 状态页签 ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .stat-card {
            background: hsla(0, 0%, 100%, 0.03);
            border-radius: 10px;
            padding: 10px 12px 12px;
            border: 1px solid hsla(0, 0%, 100%, 0.04);
        }

        .stat-card .label {
            font-size: 9px;
            font-weight: 500;
            color: hsla(0, 0%, 100%, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .stat-card .label svg {
            width: 11px;
            height: 11px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .stat-card .value {
            font-size: 17px;
            font-weight: 600;
            color: hsla(0, 0%, 100%, 0.9);
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        .stat-card .value .suffix {
            font-size: 11px;
            font-weight: 400;
            color: hsla(0, 0%, 100%, 0.25);
            margin-left: 2px;
        }

        .stat-card .bar {
            width: 100%;
            height: 2.5px;
            background: hsla(0, 0%, 100%, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-card .bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(90deg, hsl(35, 60%, 45%), hsl(35, 60%, 65%));
            width: 0%;
        }

        .stat-card .bar .fill.danger {
            background: linear-gradient(90deg, hsl(350, 50%, 45%), hsl(15, 50%, 55%));
        }
        .stat-card .bar .fill.warning {
            background: linear-gradient(90deg, hsl(40, 60%, 45%), hsl(50, 60%, 55%));
        }
        .stat-card .bar .fill.good {
            background: linear-gradient(90deg, hsl(160, 50%, 35%), hsl(140, 50%, 50%));
        }

        .stat-card .tag {
            display: inline-block;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: hsla(35, 60%, 55%, 0.1);
            color: hsl(35, 60%, 55%);
            font-weight: 500;
            margin-top: 2px;
        }

        .stat-card .tag.muted {
            background: hsla(0, 0%, 100%, 0.04);
            color: hsla(0, 0%, 100%, 0.35);
        }

        .stat-card.full {
            grid-column: 1 / -1;
        }

        /* ===== 关系页签 ===== */
        .relation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .relation-card {
            background: hsla(0, 0%, 100%, 0.03);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid hsla(0, 0%, 100%, 0.04);
            text-align: center;
        }

        .relation-card .label {
            font-size: 9px;
            font-weight: 500;
            color: hsla(0, 0%, 100%, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .relation-card .value {
            font-size: 18px;
            font-weight: 600;
            color: hsla(0, 0%, 100%, 0.9);
        }

        .relation-card .value .suffix {
            font-size: 11px;
            font-weight: 400;
            color: hsla(0, 0%, 100%, 0.25);
        }

        .relation-card .bar {
            width: 100%;
            height: 2.5px;
            background: hsla(0, 0%, 100%, 0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .relation-card .bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(90deg, hsl(35, 60%, 45%), hsl(35, 60%, 65%));
            width: 0%;
        }

        .relation-card .bar .fill.danger {
            background: linear-gradient(90deg, hsl(350, 50%, 45%), hsl(15, 50%, 55%));
        }

        .relation-card.full {
            grid-column: 1 / -1;
        }

        .relation-card .callout {
            font-size: 13px;
            color: hsl(35, 60%, 60%);
            font-weight: 500;
            margin-top: 2px;
        }

        /* ===== 事件页签 ===== */
        .event-info {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .event-badge {
            flex: 1;
            background: hsla(0, 0%, 100%, 0.03);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid hsla(0, 0%, 100%, 0.04);
            text-align: center;
        }

        .event-badge .label {
            font-size: 8px;
            font-weight: 500;
            color: hsla(0, 0%, 100%, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 1px;
        }

        .event-badge .value {
            font-size: 15px;
            font-weight: 600;
            color: hsla(0, 0%, 100%, 0.85);
        }

        .event-badge .value .sub {
            font-size: 11px;
            font-weight: 400;
            color: hsla(0, 0%, 100%, 0.25);
        }

        .event-badge .value.branch-good {
            color: hsl(140, 50%, 55%);
        }
        .event-badge .value.branch-mid {
            color: hsl(45, 60%, 55%);
        }
        .event-badge .value.branch-bad {
            color: hsl(350, 50%, 55%);
        }

        /* ===== 故事抽屉 ===== */
        .story-toggle {
            width: 100%;
            padding: 8px 0;
            background: none;
            border: none;
            border-top: 1px solid hsla(0, 0%, 100%, 0.04);
            color: hsla(0, 0%, 100%, 0.25);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .story-toggle:hover {
            color: hsla(0, 0%, 100%, 0.5);
        }

        .story-toggle svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            transition: transform 0.3s ease;
        }

        .story-toggle.open svg {
            transform: rotate(180deg);
        }

        .story-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
            opacity: 0;
        }

        .story-drawer.open {
            max-height: 70vh;
            opacity: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .story-drawer::-webkit-scrollbar {
            width: 3px;
        }
        .story-drawer::-webkit-scrollbar-track {
            background: hsla(0, 0%, 100%, 0.02);
            border-radius: 3px;
        }
        .story-drawer::-webkit-scrollbar-thumb {
            background: hsla(35, 60%, 55%, 0.2);
            border-radius: 3px;
        }
        .story-drawer::-webkit-scrollbar-thumb:hover {
            background: hsla(35, 60%, 55%, 0.35);
        }

        /* ==========================================
           时间线（固定显示，23个条目全部直接写在HTML里）
           ========================================== */
        .timeline {
            padding: 10px 0 2px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 6px;
            bottom: 6px;
            width: 1.5px;
            background: hsla(35, 60%, 55%, 0.12);
        }

        .timeline-item {
            display: flex;
            gap: 12px;
            padding-bottom: 10px;
            padding-left: 18px;
            position: relative;
            align-items: flex-start;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: hsla(35, 60%, 55%, 0.15);
            border: 1.5px solid hsla(35, 60%, 55%, 0.2);
            transition: all 0.3s ease;
        }

        .timeline-item.active::before {
            background: hsl(35, 60%, 55%);
            border-color: hsl(35, 60%, 55%);
            box-shadow: 0 0 14px hsla(35, 60%, 55%, 0.2);
        }

        .timeline-item.done::before {
            background: hsla(35, 60%, 55%, 0.4);
            border-color: hsla(35, 60%, 55%, 0.3);
        }

        .timeline-item .content {
            flex: 1;
            min-width: 0;
        }

        .timeline-item .title {
            font-size: 11px;
            font-weight: 500;
            color: hsla(0, 0%, 100%, 0.7);
            letter-spacing: 0.2px;
        }

        .timeline-item .title .num {
            font-size: 9px;
            font-weight: 400;
            color: hsla(0, 0%, 100%, 0.2);
            margin-right: 4px;
        }

        .timeline-item .desc {
            font-size: 10px;
            color: hsla(0, 0%, 100%, 0.3);
            line-height: 1.5;
            margin-top: 1px;
        }

        .timeline-item .img-thumb {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid hsla(0, 0%, 100%, 0.06);
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, hsla(35, 30%, 15%, 0.3), hsla(270, 20%, 15%, 0.2));
            position: relative;
        }

        .timeline-item .img-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .timeline-item .img-thumb:hover {
            border-color: hsla(35, 60%, 55%, 0.25);
            transform: scale(1.05);
        }

        .timeline-item .img-thumb .placeholder-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsla(0, 0%, 100%, 0.06);
        }
        .timeline-item .img-thumb .placeholder-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            opacity: 0.4;
        }

        .timeline-item .row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
        }
        .timeline-item .row .content {
            flex: 1;
            min-width: 0;
        }

        /* ==========================================
           故事页签 · 翻牌堆叠设计（移植自测试版）
           ========================================== */
        .story-stack-wrapper {
            width: 100%;
            padding: 4px 0 2px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-stack-wrapper .story-hint {
            font-size: 10px;
            color: hsla(0, 0%, 100%, 0.12);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 400;
            text-align: center;
        }
        .story-stack-wrapper .story-hint span {
            display: inline-block;
            animation: pulseHint 2.5s ease-in-out infinite;
        }
        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
        }

        .card-stack {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4.2;
            max-height: 420px;
            margin: 0 auto;
            perspective: 1200px;
        }

        .stack-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            cursor: default;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.5s ease,
                opacity 0.4s ease;
            transform-style: preserve-3d;
        }

        .stack-card .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            backface-visibility: hidden;
            overflow-y: auto;
            overflow-x: hidden;
            /* ==== 修复1：加深背景，提升白色文字可读性 ==== */
            background: hsla(220, 12%, 10%, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid hsla(0, 0%, 100%, 0.07);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 0;
            cursor: pointer;
        }

        .stack-card .card-face::-webkit-scrollbar {
            width: 2px;
        }
        .stack-card .card-face::-webkit-scrollbar-track {
            background: transparent;
        }
        .stack-card .card-face::-webkit-scrollbar-thumb {
            background: hsla(35, 60%, 55%, 0.15);
            border-radius: 2px;
        }

        .stack-card .card-front {
            display: flex;
            flex-direction: column;
        }

        .stack-card .card-front .card-img {
            width: 100%;
            height: 55%;
            overflow: hidden;
            background: linear-gradient(135deg, hsla(35, 30%, 10%, 0.4), hsla(270, 20%, 10%, 0.3));
            flex-shrink: 0;
            position: relative;
        }

        .stack-card .card-front .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .stack-card .card-front .card-img .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsla(0, 0%, 100%, 0.06);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .stack-card .card-front .card-body {
            padding: 12px 16px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 70px;
            /* 确保文字在深色背景上清晰 */
            background: transparent;
        }

        .stack-card .card-front .card-body .card-number {
            font-size: 9px;
            font-weight: 500;
            color: hsla(35, 60%, 55%, 0.35);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stack-card .card-front .card-body .card-title {
            font-size: 15px;
            font-weight: 600;
            color: hsla(0, 0%, 100%, 0.92);
            letter-spacing: 0.3px;
            line-height: 1.3;
            margin-bottom: 3px;
        }

        .stack-card .card-front .card-body .card-desc {
            font-size: 11.5px;
            color: hsla(0, 0%, 100%, 0.5);
            line-height: 1.5;
        }

        .stack-card .card-back {
            transform: rotateY(180deg);
            /* ==== 修复1：背面也加深背景 ==== */
            background: hsla(220, 12%, 10%, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid hsla(35, 60%, 55%, 0.08);
            padding: 18px 16px 16px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .stack-card .card-back .back-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid hsla(0, 0%, 100%, 0.06);
        }

        .stack-card .card-back .back-header .back-number {
            font-size: 9px;
            color: hsla(35, 60%, 55%, 0.3);
            letter-spacing: 0.5px;
        }

        .stack-card .card-back .back-header .back-title {
            font-size: 12px;
            font-weight: 500;
            color: hsla(0, 0%, 100%, 0.6);
            letter-spacing: 0.3px;
        }

        .stack-card .card-back .back-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            font-size: 12px;
            line-height: 1.8;
            color: hsla(0, 0%, 100%, 0.78);
            letter-spacing: 0.2px;
        }

        /* ==== 修复2：段落间距 + 故事感排版 ==== */
        .stack-card .card-back .back-content p {
            margin-bottom: 0.9em;
            line-height: 1.9;
            text-indent: 0em;
        }

        .stack-card .card-back .back-content p:last-child {
            margin-bottom: 0;
        }

        /* 为故事内容增加首段装饰感（可选） */
        .stack-card .card-back .back-content p:first-of-type::first-letter {
            font-size: 1.4em;
            font-weight: 600;
            color: hsla(35, 60%, 65%, 0.6);
            margin-right: 0.05em;
        }

        .stack-card .card-back .back-content::-webkit-scrollbar {
            width: 2px;
        }
        .stack-card .card-back .back-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .stack-card .card-back .back-content::-webkit-scrollbar-thumb {
            background: hsla(35, 60%, 55%, 0.12);
            border-radius: 2px;
        }

        /* ===== 导航按钮 ===== */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: hsla(0, 0%, 100%, 0.06);
            border: 1px solid hsla(0, 0%, 100%, 0.08);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: hsla(0, 0%, 100%, 0.3);
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 0;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
        }

        .nav-btn:hover {
            background: hsla(0, 0%, 100%, 0.12);
            color: hsla(0, 0%, 100%, 0.6);
            border-color: hsla(35, 60%, 55%, 0.2);
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.prev {
            left: -6px;
        }
        .nav-btn.next {
            right: -6px;
        }

        .stack-card.pos-0 .nav-btn {
            display: flex;
        }
        .stack-card:not(.pos-0) .nav-btn {
            display: none;
        }
        .stack-card.flipped .nav-btn {
            display: none !important;
        }
        .stack-card.flipped .card-back .nav-btn {
            display: flex !important;
        }
        .nav-btn.hidden {
            opacity: 0;
            pointer-events: none !important;
            cursor: default;
        }

        /* ===== 堆叠位置 ===== */
        .stack-card.pos-0 {
            transform: translateY(0px) rotate(0deg) scale(1);
            z-index: 6;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }
        .stack-card.pos-1 {
            transform: translateY(8px) rotate(1.2deg) scale(0.97);
            z-index: 5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .stack-card.pos-2 {
            transform: translateY(14px) rotate(-0.8deg) scale(0.94);
            z-index: 4;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.32);
        }
        .stack-card.pos-3 {
            transform: translateY(18px) rotate(0.6deg) scale(0.91);
            z-index: 3;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.26);
        }
        .stack-card.pos-4 {
            transform: translateY(22px) rotate(-0.4deg) scale(0.88);
            z-index: 2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        .stack-card.pos-5 {
            transform: translateY(24px) rotate(0.2deg) scale(0.85);
            z-index: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
        }

        .stack-card.flipped {
            transform: translateY(0px) rotate(0deg) scale(1) rotateY(180deg);
            z-index: 10;
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.6);
        }

        .stack-card.flying-out {
            transition: transform 0.6s cubic-bezier(0.34, 0.1, 0.2, 0.9),
                opacity 0.6s cubic-bezier(0.34, 0.1, 0.2, 0.9);
            pointer-events: none !important;
            z-index: 20 !important;
        }

        .stack-card.flying-out.prev-direction {
            transform: translateX(-80px) translateY(60px) rotate(-15deg) scale(0.85);
            opacity: 0;
        }

        .stack-card.flying-out.next-direction {
            transform: translateX(80px) translateY(60px) rotate(15deg) scale(0.85);
            opacity: 0;
        }

        .stack-card.slide-in {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.4s ease;
        }

        .card-counter {
            text-align: center;
            margin-top: 10px;
            font-size: 10px;
            color: hsla(0, 0%, 100%, 0.08);
            letter-spacing: 0.5px;
        }
        .card-counter .count-num {
            color: hsla(35, 60%, 55%, 0.2);
            font-weight: 500;
        }

        /* ===== 图片放大遮罩 ===== */
        .image-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            cursor: pointer;
        }

        .image-overlay.open {
            display: flex;
        }

        .image-overlay .overlay-inner {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            cursor: default;
        }

        .image-overlay .overlay-inner img {
            max-width: 90vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .image-overlay .close-btn {
            position: absolute;
            top: -36px;
            right: 0;
            background: none;
            border: none;
            color: hsla(0, 0%, 100%, 0.4);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            line-height: 1;
        }

        .image-overlay .close-btn:hover {
            color: hsla(0, 0%, 100%, 0.8);
            transform: scale(1.1);
        }

        .image-overlay .overlay-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: hsla(0, 0%, 100%, 0.15);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ===== 作者页签 ===== */
        .author-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .author-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px 20px 20px;
            background: hsla(0, 0%, 100%, 0.03);
            border-radius: 18px;
            border: 1px solid hsla(0, 0%, 100%, 0.05);
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .author-card:hover {
            background: hsla(0, 0%, 100%, 0.06);
            border-color: hsla(35, 60%, 55%, 0.1);
        }

        .author-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid hsla(35, 60%, 55%, 0.12);
            transition: all 0.4s ease;
        }

        .author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .author-avatar:hover {
            border-color: hsla(35, 60%, 55%, 0.25);
        }

        .author-name {
            font-size: 14px;
            font-weight: 600;
            color: hsla(0, 0%, 100%, 0.75);
            letter-spacing: 0.5px;
        }

        .author-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 500;
            color: hsla(35, 60%, 55%, 0.5);
            text-decoration: none;
            letter-spacing: 0.3px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid hsla(35, 60%, 55%, 0.1);
            background: hsla(35, 60%, 55%, 0.04);
            transition: all 0.3s ease;
            font-family: inherit;
            cursor: pointer;
        }

        .author-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .author-link:hover {
            color: hsl(35, 60%, 65%);
            border-color: hsla(35, 60%, 55%, 0.25);
            background: hsla(35, 60%, 55%, 0.08);
            transform: translateY(-1px);
        }

        .author-footer-text {
            font-size: 9px;
            color: hsla(0, 0%, 100%, 0.15);
            letter-spacing: 0.3px;
            line-height: 1.6;
            text-align: center;
            margin-top: 2px;
        }

        /* ==========================================
           响应式适配
           ========================================== */
        @media (max-width: 420px) {
            .status-container {
                padding: 12px 12px 10px;
                border-radius: 16px;
            }
            .header-title {
                font-size: 11px;
            }
            .header-info {
                font-size: 10px;
                gap: 8px;
            }
            .header-info .day {
                font-size: 10px;
            }
            .inner-voice .text {
                font-size: 12px;
            }
            .stat-grid {
                gap: 5px;
            }
            .stat-card {
                padding: 8px 10px 10px;
            }
            .stat-card .value {
                font-size: 15px;
            }
            .relation-grid {
                gap: 5px;
            }
            .relation-card {
                padding: 10px;
            }
            .relation-card .value {
                font-size: 16px;
            }
            .tab-btn {
                font-size: 9px;
                padding: 5px 0;
            }
            .tab-btn svg {
                width: 12px;
                height: 12px;
            }
            .timeline-item {
                padding-bottom: 8px;
                padding-left: 16px;
            }
            .timeline-item .title {
                font-size: 10px;
            }
            .timeline-item .desc {
                font-size: 9px;
            }
            .timeline-item .img-thumb {
                width: 36px;
                height: 36px;
            }
            .story-drawer.open {
                max-height: 60vh;
            }
            .card-stack {
                max-height: 340px;
            }
            .stack-card .card-front .card-body .card-title {
                font-size: 13px;
            }
            .stack-card .card-front .card-body .card-desc {
                font-size: 10.5px;
            }
            .stack-card .card-front .card-body {
                padding: 10px 14px 12px;
                min-height: 60px;
            }
            .stack-card .card-back {
                padding: 14px 14px 12px;
            }
            .stack-card .card-back .back-content {
                font-size: 11px;
                line-height: 1.7;
            }
            .stack-card .card-back .back-header .back-title {
                font-size: 11px;
            }
            .nav-btn {
                width: 28px;
                height: 28px;
            }
            .nav-btn svg {
                width: 14px;
                height: 14px;
            }
            .nav-btn.prev {
                left: -4px;
            }
            .nav-btn.next {
                right: -4px;
            }
            .author-card {
                padding: 18px 16px 16px;
            }
            .author-avatar {
                width: 52px;
                height: 52px;
            }
            .author-name {
                font-size: 13px;
            }
            .author-link {
                font-size: 10px;
                padding: 5px 12px;
            }
            .author-link svg {
                width: 13px;
                height: 13px;
            }
            /* 小屏段落间距微调 */
            .stack-card .card-back .back-content p {
                margin-bottom: 0.7em;
                line-height: 1.7;
            }
        }

        @media (max-width: 380px) {
            .card-stack {
                max-height: 290px;
            }
            .stack-card .card-front .card-body .card-title {
                font-size: 12px;
            }
            .stack-card .card-front .card-body .card-desc {
                font-size: 10px;
            }
            .stack-card .card-front .card-body {
                padding: 8px 12px 10px;
                min-height: 50px;
            }
            .stack-card .card-back .back-content {
                font-size: 10px;
            }
            .stack-card .card-back {
                padding: 12px 12px 10px;
            }
        }

        @media (max-width: 360px) {
            .stat-grid {
                grid-template-columns: 1fr;
            }
            .relation-grid {
                grid-template-columns: 1fr;
            }
            .event-info {
                flex-direction: column;
                gap: 5px;
            }
        }

        @media (min-width: 600px) {
            .status-container {
                max-width: 520px;
                padding: 20px 20px 16px;
                border-radius: 24px;
            }
            .stat-grid {
                gap: 8px;
            }
            .stat-card {
                padding: 12px 16px 14px;
            }
            .stat-card .value {
                font-size: 19px;
            }
            .relation-grid {
                gap: 8px;
            }
            .relation-card {
                padding: 14px;
            }
            .timeline-item .img-thumb {
                width: 48px;
                height: 48px;
            }
            .story-drawer.open {
                max-height: 65vh;
            }
            .card-stack {
                max-height: 460px;
            }
            .author-avatar {
                width: 72px;
                height: 72px;
            }
            .author-name {
                font-size: 16px;
            }
        }

        @media (min-width: 900px) {
            .status-container {
                max-width: 560px;
                padding: 24px 24px 18px;
                border-radius: 28px;
            }
            .story-drawer.open {
                max-height: 70vh;
            }
            .card-stack {
                max-height: 480px;
            }
        }
    </style>
</head>
<body>

    <div class="status-container" id="app">
        <!-- ===== 顶部栏 ===== -->
        <div class="header">
            <div class="header-left">
                <div class="header-title">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    合住之后
                </div>
            </div>
            <div class="header-info">
                <span class="scene" id="sceneDisplay"></span>
                <span class="dot"></span>
                <span class="time" id="timeDisplay"></span>
                <span class="day" id="dayDisplay"></span>
                <button class="fold-btn" onclick="toggleFold()" aria-label="折叠">
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
            </div>
        </div>

        <!-- ===== 内心话 ===== -->
        <div class="inner-voice" id="innerVoice">
            <span class="quote-mark left">"</span>
            <span class="icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <div class="text" id="innerText">
                <span id="innerVoiceContent"></span>
                <span class="name-tag">—— 有菜 · 此刻</span>
            </div>
            <span class="quote-mark right">"</span>
        </div>

        <!-- ===== 页签栏 ===== -->
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="status">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                状态
            </button>
            <button class="tab-btn" data-tab="relation">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                关系
            </button>
            <button class="tab-btn" data-tab="event">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                事件
            </button>
            <button class="tab-btn" data-tab="story">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                故事
            </button>
            <button class="tab-btn" data-tab="author">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                作者
            </button>
        </div>

        <!-- ===== 页签内容 ===== -->
        <div class="tab-content">

            <!-- 状态页签 -->
            <div class="tab-pane active" id="tab-status">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="label"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>好感度</div>
                        <div class="value" id="likeVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="likeBar"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>信任度</div>
                        <div class="value" id="trustVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="trustBar"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>自我伤害</div>
                        <div class="value" id="harmVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="harmBar"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>情绪</div>
                        <div class="value" id="emotionVal" style="font-size:15px;"></div>
                        <div><span class="tag" id="emotionTag"></span></div>
                    </div>
                </div>
            </div>

            <!-- 关系页签 -->
            <div class="tab-pane" id="tab-relation">
                <div class="relation-grid">
                    <div class="relation-card">
                        <span class="label">亲密度</span>
                        <div class="value" id="intimacyVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="intimacyBar"></div></div>
                    </div>
                    <div class="relation-card">
                        <span class="label">隔阂值</span>
                        <div class="value" id="gapVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="gapBar"></div></div>
                    </div>
                    <div class="relation-card">
                        <span class="label">信任度</span>
                        <div class="value" id="relationTrustVal"><span class="suffix">/100</span></div>
                        <div class="bar"><div class="fill" id="relationTrustBar"></div></div>
                    </div>
                    <div class="relation-card full">
                        <span class="label">当前称呼</span>
                        <div class="callout" id="calloutVal"></div>
                    </div>
                </div>
            </div>

            <!-- 事件页签 -->
            <div class="tab-pane" id="tab-event">
                <div class="event-info">
                    <div class="event-badge">
                        <span class="label">进度</span>
                        <div class="value" id="progressVal"><span class="sub">/ 17</span></div>
                    </div>
                    <div class="event-badge">
                        <span class="label">分支</span>
                        <div class="value" id="branchVal"></div>
                    </div>
                </div>
                <button class="story-toggle" id="storyToggle" onclick="toggleStory()">
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                    展开故事时间线
                </button>
                <div class="story-drawer" id="storyDrawer">
                    <div class="timeline" id="timelineContainer"></div>
                </div>
            </div>

            <!-- ===== 故事页签 · 翻牌堆叠设计 ===== -->
            <div class="tab-pane" id="tab-story">
                <div class="story-stack-wrapper">
                    <div class="story-hint"><span>✦ 点击卡片 · 翻转查看故事 ✦</span></div>
                    <div class="card-stack" id="storyCardStack">

            detail: '<p>春节过完，你要回去了。</p><p>那天下午天色灰沉沉的，风不大但很冷，她站在门口，看着你收拾东西。你没有带很多行李，一个小包，很快就装好了。</p><p>你走到门口，她站在门框那里，没有让开。</p><p>"……你要走了。"她说。不是问句。</p><p>"嗯。"你说。你拉了拉包的带子，"暑假再回来。"</p><p>她不说话。</p><p>你侧过身想从她旁边过去，她往旁边移了一小步，正好挡住你。</p><p>"……堂妹。"你说。</p><p>她低下头，看着自己的鞋尖，过了一会儿才开口："……你一定要回来。"</p><p>"一定。"你说。你伸手在她头顶轻轻按了一下，"……说话算话。"</p><p>她抬起头看你，嘴唇动了动，想说什么，又咽回去了。然后她往旁边让了让，给你让出一条路。</p><p>你走出去的时候听到身后很轻很轻的一声"堂哥"。你回头看了一眼，她站在门口，风吹着她的头发，眼眶有点红，但没有哭。她抬起手，轻轻挥了一下，又放下来了，像怕挥重了会把什么东西弄碎。</p><p>暑假你回去的时候，她已经等在那棵大树下面了。远远地看到你，她跑了几步，又停下来，站在那里看着你。她没叫你，只是等你走过来。</p><p>"……堂哥。"她说那两个字的时候声音很稳，像已经等了好久了。</p><p>你走过去，站在她面前，想说点什么，但开口的时候只说了一句："……我回来了。"</p><p>她笑了一下。风吹过来，她的头发轻轻动着。</p><p>"嗯，"她说，"我知道。"</p>'

            detail: '<p>高中那年，她对着镜子试了一下扎双马尾。</p><p>她已经很久没有扎过了。小时候她自己会扎，后来不扎了，再后来想扎，手已经不太记得该怎么绕了。</p><p>她把头发分成两束，用皮筋绕了两圈。镜子里的那张脸——下巴圆了一点，脸颊线条柔和了很多，眼睛也跟小时候不太一样了，没那么亮了，像一根细细的蜡烛，风一吹就会晃一晃。她看了很久。</p><p>后来她站起来，拆掉皮筋，头发散下来落在肩上。她走到门口，没有回头。那天晚上她发了一条动态。很短，只有一行字。</p><p>"试了一下，不太会扎了。"</p><p>你看到了。你没有评论，没有点赞，只是看着那条动态，屏幕的光映在你的脸上。你想起很多年前，她站在那棵大树下面，红头绳在风里飘着，像一小簇火。你看了一会儿，按灭了手机。</p><p>你没有告诉她，你其实还记得那时候她的样子。</p>'

            detail: '<p>电话响的时候，你在客厅里。</p><p>接起来，那边说了一句什么。你站在那里，没有动。手里的听筒还贴着耳朵，但那边已经没有人说话了。你慢慢放下来，手指松了，听筒滑落在桌面上，发出一声短促的闷响。</p><p>你站在那里，看着窗外。外面是下午，阳光从窗户照进来，落在地板上。你想，这片阳光和昨天没有什么区别，和前天也没有区别。可是有些东西不一样了。你说不上来是什么，你只是站在那里，看着那片阳光，像在看一样很陌生的东西，像在看一样你以前从来没有注意过的东西。</p><p>你把手撑在桌沿上，慢慢地坐下来。坐下来之后，你发现自己的手在发抖，不是很明显的那种抖，是很轻微的、持续的，像有什么东西在里面轻轻地颤抖着。你低头看着自己的手，手指微微蜷缩，又松开，又蜷缩。你不知道自己在做什么，你只是看着它们，好像在看别人的手。</p><p>后来你站起来，把掉在地上的听筒捡起来，放回座机上。动作很慢，像在完成一件需要很大力气才能完成的事。</p><p>你走到窗边，又站在了那里。阳光落在你的手上，你觉得暖。你把翻过来，看着自己的掌心，手心有一点汗。你不知道这汗是怎么来的。你把手握紧了，又松开，掌心空空的，什么都没有。你想起那天早上出门的时候，你没有关门，门一直是开着的。你不知道那扇门后来是谁关上的。</p>'

            desc: '行李箱轮子滚过地板。她站在玄关，穿着洗得发白的旧运动鞋。',

            detail: '<p>行李箱的轮子在地板上滚过，发出沉闷的响声。她站在门口，没有进来。她穿着一双洗得发白的旧运动鞋，鞋带系得很紧，两只鞋的结头一样大。</p><p>你站在客厅里，没有走过去。</p><p>"进来吧。"你说，"鞋柜最下面那层空出来了。"</p><p>她低头看了一眼鞋柜，又看了看你。然后弯腰把鞋脱了，两只鞋整整齐齐地摆在一起，靠得很近。她穿着一双旧袜子，脚踝露出来一小截。</p><p>她跟着你走到那扇门前面，你推开门，退到一侧，让她自己走进去。床铺好了，枕套是新的，床头柜上放着一杯水，玻璃杯干净，水面平着。</p><p>"杯子是干净的。"你说。</p><p>她走进去，站在房间中央，手里还攥着背包的肩带。她看了一圈，目光没有在任何一样东西上多停留，然后她轻声说了一句："……谢谢。"</p><p>你走回客厅，把门留了一条缝。光从门缝里透进去，落在她的脚边。她看着那道光。没有走过去把它合上，也没有把它彻底打开。后来她把背包放在床边，坐下来——没有坐在床上，坐在床边的地板上，膝盖并拢，手指搭在膝盖上。</p><p>那杯水放在床头柜上，她没有碰。水还是满的。</p>'

            function extractText(node) {
                if (node.nodeType === 3) {
                    var text = node.textContent;
                    for (var i = 0; i < text.length; i++) {
                        allChars.push({ type: 'char', char: text[i] });
                    }
                } else if (node.nodeType === 1) {
                    var tagName = node.tagName.toLowerCase();
                    allChars.push({ type: 'open', tag: tagName });
                    for (var child = node.firstChild; child; child = child.nextSibling) {
                        extractText(child);
                    }
                    allChars.push({ type: 'close', tag: tagName });
                }
            }
            for (var i = 0; i < nodes.length; i++) {
                extractText(nodes[i]);
            }

            var output = '';
            var index = 0;

            function typeNext() {
                if (index >= allChars.length) return;
                var item = allChars[index];
                if (item.type === 'char') {
                    output += item.char;
                    element.innerHTML = output;
                    index++;
                    storyTypewriterTimeout = setTimeout(typeNext, speed);
                } else if (item.type === 'open') {
                    output += '<' + item.tag + '>';
                    element.innerHTML = output;
                    index++;
                    storyTypewriterTimeout = setTimeout(typeNext, 0);
                } else if (item.type === 'close') {
                    output += '</' + item.tag + '>';
                    element.innerHTML = output;
                    index++;
                    storyTypewriterTimeout = setTimeout(typeNext, 0);
                }
            }
            if (storyTypewriterTimeout) {
                clearTimeout(storyTypewriterTimeout);
                storyTypewriterTimeout = null;
            }
            typeNext();
        }

        function buildStoryCards() {
            if (!els.storyCardStack) return;
            var html = '';
            for (var i = 0; i < storyTotalCards; i++) {
                var item = storyData[i];
                var imgHtml;
                if (item.img) {
                    imgHtml = '<img src="' + item.img + '" alt="' + item.title + '" loading="lazy" onclick="event.stopPropagation();openImageOverlay(\'' +
                        item.img + '\', \'' + item.title + '\')" />';
                } else {
                    imgHtml = '<div class="placeholder">📸</div>';
                }

                html += '<div class="stack-card pos-' + i + '" data-story-index="' + i + '">' +
                    '<div class="card-face card-front" onclick="flipStoryCard(' + i + ')">' +
                    '<div class="card-img">' + imgHtml + '</div>' +
                    '<div class="card-body">' +
                    '<div class="card-number">#' + item.id + '</div>' +
                    '<div class="card-title">' + item.title + '</div>' +
                    '<div class="card-desc">' + item.desc + '</div>' +
                    '</div>' +
                    '<button class="nav-btn prev" onclick="event.stopPropagation();switchStoryCard(-1)" aria-label="上一张">' +
                    '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>' +
                    '</button>' +
                    '<button class="nav-btn next" onclick="event.stopPropagation();switchStoryCard(1)" aria-label="下一张">' +
                    '<svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>' +
                    '</button>' +
                    '</div>' +
                    '<div class="card-face card-back" onclick="flipStoryCard(' + i + ')">' +
                    '<div class="back-header">' +
                    '<span class="back-number">#' + item.id + '</span>' +
                    '<span class="back-title">' + item.title + '</span>' +
                    '</div>' +
                    '<div class="back-content" id="story-back-content-' + i + '"></div>' +
                    '<button class="nav-btn prev" onclick="event.stopPropagation();switchStoryCard(-1)" aria-label="上一张">' +
                    '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>' +
                    '</button>' +
                    '<button class="nav-btn next" onclick="event.stopPropagation();switchStoryCard(1)" aria-label="下一张">' +
                    '<svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>' +
                    '</button>' +
                    '</div>' +
                    '</div>';
            }
            els.storyCardStack.innerHTML = html;
            updateStoryButtons();
            updateStoryCounter();
        }

        function updateStoryButtons() {
            var cards = document.querySelectorAll('.stack-card');
            cards.forEach(function(card, idx) {
                var isFlipped = card.classList.contains('flipped');
                var prevBtns = card.querySelectorAll('.nav-btn.prev');
                var nextBtns = card.querySelectorAll('.nav-btn.next');
                prevBtns.forEach(function(btn) {
                    if (idx === 0) { btn.classList.add('hidden'); } else { btn.classList.remove('hidden'); }
                });
                nextBtns.forEach(function(btn) {
                    if (idx === storyTotalCards - 1) { btn.classList.add('hidden'); } else { btn.classList.remove(
                            'hidden'); }
                });
                if (isFlipped) {
                    var backContent = card.querySelector('.back-content');
                    if (backContent && backContent.children.length === 0) {
                        var item = storyData[idx];
                        storyTypeWriter(backContent, item.detail, 8);
                    }
                }
            });
        }

        function flipStoryCard(index) {
            if (storyIsAnimating) return;
            var cardEl = document.querySelector('.stack-card[data-story-index="' + index + '"]');
            if (!cardEl) return;

            if (storyFlippedIndex === index) {
                cardEl.classList.remove('flipped');
                var backContent = cardEl.querySelector('.back-content');
                if (backContent) backContent.innerHTML = '';
                storyFlippedIndex = -1;
                reorderStoryStack();
                updateStoryButtons();
                updateStoryCounter();
                return;
            }

            if (storyFlippedIndex !== -1) {
                var oldCard = document.querySelector('.stack-card[data-story-index="' + storyFlippedIndex + '"]');
                if (oldCard) {
                    oldCard.classList.remove('flipped');
                    var oldBack = oldCard.querySelector('.back-content');
                    if (oldBack) oldBack.innerHTML = '';
                }
                storyFlippedIndex = -1;
                reorderStoryStack();
            }

            cardEl.classList.add('flipped');
            storyFlippedIndex = index;
            reorderStoryStack();

            requestAnimationFrame(function() {
                var backContent = document.querySelector('.stack-card[data-story-index="' + index + '"] .back-content');
                if (backContent && backContent.children.length === 0) {
                    var item = storyData[index];
                    storyTypeWriter(backContent, item.detail, 8);
                }
                updateStoryButtons();
                updateStoryCounter();
            });
        }

        function switchStoryCard(direction) {
            if (storyIsAnimating) return;
            var newIndex = storyCurrentIndex + direction;
            if (newIndex < 0 || newIndex >= storyTotalCards) return;

            if (storyFlippedIndex !== -1) {
                var flippedCard = document.querySelector('.stack-card[data-story-index="' + storyFlippedIndex + '"]');
                if (flippedCard) {
                    flippedCard.classList.remove('flipped');
                    var backContent = flippedCard.querySelector('.back-content');
                    if (backContent) backContent.innerHTML = '';
                }
                storyFlippedIndex = -1;
                reorderStoryStack();
                updateStoryButtons();
                updateStoryCounter();
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        performStorySwitch(direction, newIndex);
                    });
                });
                return;
            }
            performStorySwitch(direction, newIndex);
        }

        function performStorySwitch(direction, newIndex) {
            storyIsAnimating = true;
            var currentCard = document.querySelector('.stack-card[data-story-index="' + storyCurrentIndex + '"]');
            var nextCard = document.querySelector('.stack-card[data-story-index="' + newIndex + '"]');
            if (!currentCard || !nextCard) { storyIsAnimating = false; return; }

            var flyClass = direction === 1 ? 'next-direction' : 'prev-direction';
            currentCard.classList.add('flying-out', flyClass);

            setTimeout(function() {
                currentCard.classList.remove('flying-out', flyClass);
                storyCurrentIndex = newIndex;
                reorderStoryStack();
                updateStoryButtons();
                updateStoryCounter();
                storyIsAnimating = false;
                if (storyFlippedIndex !== -1) {
                    var backContent = document.querySelector('.stack-card[data-story-index="' + storyFlippedIndex +
                        '"] .back-content');
                    if (backContent && backContent.children.length === 0) {
                        var item = storyData[storyFlippedIndex];
                        storyTypeWriter(backContent, item.detail, 8);
                    }
                }
            }, 550);
        }

        function reorderStoryStack() {
            var cards = document.querySelectorAll('.stack-card');
            var activeIndex = storyFlippedIndex !== -1 ? storyFlippedIndex : storyCurrentIndex;
            cards.forEach(function(card) {
                var cardIndex = parseInt(card.dataset.storyIndex);
                var relativePos = (cardIndex - activeIndex + storyTotalCards) % storyTotalCards;
                var pos = Math.min(relativePos, 5);
                card.classList.remove('pos-0', 'pos-1', 'pos-2', 'pos-3', 'pos-4', 'pos-5');
                if (card.classList.contains('flipped')) {
                    card.classList.add('pos-0');
                } else {
                    card.classList.add('pos-' + pos);
                }
            });
            storyCurrentIndex = activeIndex;
            updateStoryCounter();
        }

        function updateStoryCounter() {
            if (!els.storyCounter) return;
            var displayIndex = storyFlippedIndex !== -1 ? storyFlippedIndex : storyCurrentIndex;
            els.storyCounter.textContent = (displayIndex + 1);
        }

        // ==========================================
        // 键盘和触摸控制（故事卡片）
        // ==========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') { e.preventDefault();
                switchStoryCard(-1); } else if (e.key === 'ArrowRight') { e.preventDefault();
                switchStoryCard(1); } else if (e.key === 'Escape') {
                if (storyFlippedIndex !== -1) {
                    var cardEl = document.querySelector('.stack-card[data-story-index="' + storyFlippedIndex + '"]');
                    if (cardEl) {
                        cardEl.classList.remove('flipped');
                        var backContent = cardEl.querySelector('.back-content');
                        if (backContent) backContent.innerHTML = '';
                    }
                    storyFlippedIndex = -1;
                    reorderStoryStack();
                    updateStoryButtons();
                    updateStoryCounter();
                }
            }
        });

        var storyTouchStartX = 0;
        var storyTouchStartY = 0;
        if (els.storyCardStack) {
            els.storyCardStack.addEventListener('touchstart', function(e) {
                var touch = e.touches[0];
                storyTouchStartX = touch.clientX;
                storyTouchStartY = touch.clientY;
            }, { passive: true });

            els.storyCardStack.addEventListener('touchend', function(e) {
                var touch = e.changedTouches[0];
                var deltaX = touch.clientX - storyTouchStartX;
                var deltaY = touch.clientY - storyTouchStartY;
                if (Math.abs(deltaX) < 30 || Math.abs(deltaX) < Math.abs(deltaY)) return;
                if (deltaX < 0) { switchStoryCard(1); } else { switchStoryCard(-1); }
            }, { passive: true });
        }

        // ==========================================
        // 时间线构建（事件页签抽屉）
        // ==========================================
        function buildTimelineItems() {
            var allEvents = backgroundEvents.concat(sharedEvents);
            var branchData = branchEvents[state.branch || '好线'] || branchEvents['好线'];
            var allItems = allEvents.concat(branchData);
            var html = '';
            for (var i = 0; i < allItems.length; i++) {
                var item = allItems[i];
                var imgHtml;
                if (item.img) {
                    imgHtml = '<img src="' + item.img + '" alt="' + item.title + '" onclick="openImageOverlay(\'' +
                        item.img + '\', \'' + item.title + '\')" />';
                } else {
                    imgHtml = '<div class="placeholder-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>';
                }
                var onclickAttr = item.img ? ' onclick="openImageOverlay(\'' + item.img + '\', \'' + item.title +
                    '\')"' : '';
                var cursorStyle = item.img ? '' : 'cursor:default;';
                html += '<div class="timeline-item" id="event-item-' + item.id + '" data-id="' + item.id + '">' +
                    '<div class="row">' +
                    '<div class="content">' +
                    '<div class="title"><span class="num">#' + item.id + '</span>' + item.title + '</div>' +
                    '<div class="desc" id="event-desc-' + item.id + '">' + item.desc + '</div>' +
                    '</div>' +
                    '<div class="img-thumb"' + onclickAttr + ' style="' + cursorStyle + '">' +
                    imgHtml +
                    '</div>' +
                    '</div>' +
                    '</div>';
            }
            return html;
        }

        function updateTimelineStatus() {
            var progress = state.progress !== undefined ? state.progress : 0;
            var activeId = progress + 6;
            for (var id = 1; id <= 23; id++) {
                var el = document.getElementById('event-item-' + id);
                if (!el) continue;
                var isActive = (id === activeId);
                var isDone = (id < activeId);
                el.classList.remove('active', 'done');
                if (isActive) { el.classList.add('active'); } else if (isDone) { el.classList.add('done'); }
            }
        }

        function updateBranchDescriptions() {
            var branch = state.branch || '好线';
            var branchData = branchEvents[branch] || branchEvents['好线'];
            for (var i = 0; i < branchData.length; i++) {
                var item = branchData[i];
                var descEl = document.getElementById('event-desc-' + item.id);
                if (descEl) descEl.textContent = item.desc;
            }
        }

        // ==========================================
        // 图片放大（全局）
        // ==========================================
        function openImageOverlay(imgSrc, title) {
            if (!imgSrc) return;
            els.overlayImg.src = imgSrc;
            els.overlayLabel.textContent = title || '点击任意位置关闭';
            els.overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeImageOverlay() {
            els.overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageOverlay();
        });

        window.openImageOverlay = openImageOverlay;
        window.closeImageOverlay = closeImageOverlay;
        window.flipStoryCard = flipStoryCard;
        window.switchStoryCard = switchStoryCard;

        // ==========================================
        // 渲染数值
        // ==========================================
        function renderValues() {
            els.scene.textContent = state.scene || '';
            els.time.textContent = state.time || '';
            els.day.textContent = state.day !== undefined && state.day !== null ? '第' + state.day + '天' : '';

            els.innerVoiceContent.textContent = state.innerVoice || '';

            var like = state.like !== undefined ? state.like : '';
            els.likeVal.innerHTML = (like !== '' ? like : '') + '<span class="suffix">/100</span>';
            els.likeBar.style.width = (like !== '' ? like : 0) + '%';

            var trust = state.trust !== undefined ? state.trust : '';
            els.trustVal.innerHTML = (trust !== '' ? trust : '') + '<span class="suffix">/100</span>';
            els.trustBar.style.width = (trust !== '' ? trust : 0) + '%';

            var harm = state.harm !== undefined ? state.harm : '';
            els.harmVal.innerHTML = (harm !== '' ? harm : '') + '<span class="suffix">/100</span>';
            els.harmBar.style.width = (harm !== '' ? harm : 0) + '%';

            els.emotionVal.textContent = state.emotion || '';
            els.emotionTag.textContent = (state.emotion ? state.emotion + ' · ' + getEmotionTag(state.emotion) : '');

            var intimacy = state.intimacy !== undefined ? state.intimacy : '';
            els.intimacyVal.innerHTML = (intimacy !== '' ? intimacy : '') + '<span class="suffix">/100</span>';
            els.intimacyBar.style.width = (intimacy !== '' ? intimacy : 0) + '%';

            var gap = state.gap !== undefined ? state.gap : '';
            els.gapVal.innerHTML = (gap !== '' ? gap : '') + '<span class="suffix">/100</span>';
            els.gapBar.style.width = (gap !== '' ? gap : 0) + '%';

            els.relationTrustVal.innerHTML = (trust !== '' ? trust : '') + '<span class="suffix">/100</span>';
            els.relationTrustBar.style.width = (trust !== '' ? trust : 0) + '%';

            els.calloutVal.textContent = state.callout || '';

            var progress = state.progress !== undefined ? state.progress : '';
            els.progressVal.innerHTML = (progress !== '' ? progress : '') + ' <span class="sub">/ 17</span>';
            var branch = state.branch || '';
            els.branchVal.textContent = branch;
            els.branchVal.className = 'value' + (branch ? ' ' + getBranchClass(branch) : '');
        }

        function getEmotionTag(emotion) {
            var map = { '麻木': '低沉', '低落': '压抑', '平静': '稳定', '开心': '温暖', '期待': '微光', '害怕': '不安', '安心': '柔缓' };
            return map[emotion] || '';
        }

        function getBranchClass(branch) {
            var map = { '好线': 'branch-good', '中间线': 'branch-mid', '坏线': 'branch-bad' };
            return map[branch] || '';
        }

        function render() {
            if (els.timelineContainer && els.timelineContainer.children.length === 0) {
                els.timelineContainer.innerHTML = buildTimelineItems();
            }
            updateBranchDescriptions();
            updateTimelineStatus();
            renderValues();
        }

        // ==========================================
        // 事件绑定（页签切换、折叠、抽屉）
        // ==========================================
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
                var target = document.getElementById('tab-' + this.dataset.tab);
                if (target) target.classList.add('active');
                // 进入故事页签时确保卡片已构建
                if (this.dataset.tab === 'story' && els.storyCardStack && els.storyCardStack.children.length ===
                    0) {
                    buildStoryCards();
                }
            });
        });

        function toggleFold() {
            els.app.classList.toggle('collapsed');
        }

        function toggleStory() {
            var drawer = els.storyDrawer;
            var toggle = els.storyToggle;
            drawer.classList.toggle('open');
            toggle.classList.toggle('open');
            toggle.innerHTML = drawer.classList.contains('open') ?
                '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg> 收起故事时间线' :
                '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg> 展开故事时间线';
        }

        window.toggleFold = toggleFold;
        window.toggleStory = toggleStory;

        // ==========================================
        // 初始化
        // ==========================================
        function init() {
            if (typeof waitGlobalInitialized === 'function') {
                waitGlobalInitialized('Mvu').then(function() {
                    fetchStateFromMVU();
                    render();
                    if (els.storyCardStack && els.storyCardStack.children.length === 0) {
                        buildStoryCards();
                    }
                })['catch'](function() {
                    fetchStateFromMVU();
                    render();
                    if (els.storyCardStack && els.storyCardStack.children.length === 0) {
                        buildStoryCards();
                    }
                });
            } else {
                fetchStateFromMVU();
                render();
                if (els.storyCardStack && els.storyCardStack.children.length === 0) {
                    buildStoryCards();
                }
            }

            if (typeof Mvu !== 'undefined' && Mvu.events) {
                try {
                    eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, function() {
                        fetchStateFromMVU();
                        var currentBranch = state.branch || '好线';
                        if (window._lastBranch !== currentBranch) {
                            window._lastBranch = currentBranch;
                            if (els.timelineContainer) {
                                els.timelineContainer.innerHTML = buildTimelineItems();
                            }
                        }
                        updateBranchDescriptions();
                        updateTimelineStatus();
                        renderValues();
                    });
                } catch (e) {}
            }

            setInterval(function() {
                fetchStateFromMVU();
                var currentBranch = state.branch || '好线';
                if (window._lastBranch !== currentBranch) {
                    window._lastBranch = currentBranch;
                    if (els.timelineContainer) {
                        els.timelineContainer.innerHTML = buildTimelineItems();
                    }
                }
                updateBranchDescriptions();
                updateTimelineStatus();
                renderValues();
            }, 3000);

            setTimeout(function() {
                if (els.storyCardStack && els.storyCardStack.children.length === 0) {
                    buildStoryCards();
                }
            }, 100);
        }

        if (typeof errorCatched === 'function') {
            $(errorCatched(init));
        } else {
            $(init);
        }

        console.log('🌟 合住之后 · 状态栏已加载');
        console.log('📖 故事卡片翻牌堆叠模式已启用');
        console.log('💡 点击卡片翻转 · 左右箭头切换 · 按ESC翻回');
        console.log('📅 顶部栏已添加「第X天」显示，连接变量 世界.当前天数');
    </script>

</body>
